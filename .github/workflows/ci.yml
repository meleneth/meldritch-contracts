name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make check
      - run: make package
      - uses: actions/upload-artifact@v5
        with:
          name: meldritch-contracts
          path: dist/
